<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="#101c24"/><style>text{font-family:DejaVu Sans,Arial;fill:#eee7d9;font-size:17px} .small{font-size:13px;fill:#9fb4bd}</style><text x="40" y="45" font-size="25">C5L5 · Вихід із протоколу</text><text class="small" x="40" y="75">Схема зв’язків v0.6 • номери відповідають маршруту • НЕ метричний план</text><rect x="45" y="115" width="280" height="70" rx="8" fill="#233947" stroke="#54b6b5"/><text x="57" y="137">01</text><text x="87" y="140">Передзал</text><path d="M 185 185 L 505 115" stroke="#b69a67" stroke-width="3" fill="none"/><rect x="365" y="115" width="280" height="70" rx="8" fill="#233947" stroke="#54b6b5"/><text x="377" y="137">02</text><text x="407" y="140">контрольний стелаж</text><path d="M 505 185 L 825 115" stroke="#b69a67" stroke-width="3" fill="none"/><rect x="685" y="115" width="280" height="70" rx="8" fill="#233947" stroke="#54b6b5"/><text x="697" y="137">03</text><text x="727" y="140">два адресні пости</text><path d="M 825 185 L 185 250" stroke="#b69a67" stroke-width="3" fill="none"/><rect x="45" y="250" width="280" height="70" rx="8" fill="#233947" stroke="#54b6b5"/><text x="57" y="272">04</text><text x="87" y="275">регулятор доступу</text><path d="M 185 320 L 505 250" stroke="#b69a67" stroke-width="3" fill="none"/><rect x="365" y="250" width="280" height="70" rx="8" fill="#233947" stroke="#54b6b5"/><text x="377" y="272">05</text><text x="407" y="275">верхній міст</text><path d="M 505 320 L 825 250" stroke="#b69a67" stroke-width="3" fill="none"/><rect x="685" y="250" width="280" height="70" rx="8" fill="#233947" stroke="#54b6b5"/><text x="697" y="272">06</text><text x="727" y="275">вид собору</text><rect x="45" y="565" width="910" height="80" rx="8" fill="#243329" stroke="#9aaf7c"/><text x="65" y="595">Сервісний обхід: від другого вузла до передостаннього після відкриття.</text><text class="small" x="65" y="620">Не пропускає обо