<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d2b583"/></marker><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#405053" stroke-width="1"/></pattern></defs><rect width="1400" height="1000" fill="#172125"/><g font-family="DejaVu Sans,Arial" fill="#e5e1d5"><text x="40" y="50" font-size="27">ХОР · СТАРТОВІ МЕТРИКИ GREYBOX</text><text x="40" y="80" fill="#b1b9b5" font-size="15">Гіпотези v0.5 · UE: 100 см = 1 м · розміри перевіряються у блокауті</text><rect x="30" y="110" width="610" height="400" fill="#1d2b2e" stroke="#63706e"/><text x="50" y="145" font-size="20">Герой і дверний отвір · масштаб 100 px/м</text><rect x="360" y="200" width="150" height="250" fill="none" stroke="#d2b583" stroke-width="3"/><rect x="214" y="280" width="56" height="170" rx="28" fill="#84c7c135" stroke="#84c7c1" stroke-width="2"/><circle cx="242" cy="295" r="13" fill="#e5e1d5"/><path d="M228 309 L255 309 L265 365 L259 400 L252 450 L240 450 L239 390 L227 450 L215 450 L229 366Z" fill="#427278"/><line x1="180" y1="280" x2="180" y2="450" stroke="#d2b583" marker-start="url(#a)" marker-end="url(#a)"/><text x="105" y="386" font-size="16">1,70 м</text><line x1="360" y1="175" x2="510" y2="175" stroke="#d2b583" marker-start="url(#a)" marker-end="url(#a)"/><text x="400" y="165" font-size="16">1,50 м</text><line x1="540" y1="200" x2="540" y2="450" stroke="#d2b583" marker-start="url(#a)" marker-end="url(#a)"/><text x="552" y="333" font-size="16">2,50 м</text><line x1="70" y1="450" x2="600" y2="450" stroke="#8a9790"/><text x="200" y="484" fill="#b1b9b5" font-size="15">Капсула Ø 0,56 м · half-height 0,85 м</text><rect x="670" y="110" width="700" height="400" fill="#1d2b2e" stroke="#63706e"/><text x="690" y="145" font-size="20">Модулі та прохід · план, 100 px/м</text><rect x="730" y="195" width="200" height="200" fill="url(#grid)" stroke="#84c7c1" stroke-width="3"/><text x="765" y="286" font-size="20">2 × 2 м</text><text x="760" y="314" fill="#b1b9b5" font-size="14">snap 0,25 м</text><rect x="1040" y="190" width="200" height="240" fill="#152022" stroke="#d2b583" stroke-width="3"/><circle cx="1140" cy="337" r="28" fill="#84c7c135" stroke="#84c7c1"/><line x1="1040" y1="460" x2="1240" y2="460" stroke="#d2b583" marker-start="url(#a)" marker-end="url(#a)"/><text x="1055" y="483" font-size="16">коридор 2 м</text><rect x="30" y="540" width="610" height="400" fill="#1d2b2e" stroke="#63706e"/><text x="50" y="575" font-size="20">Профіль сходів · масштаб 200 px/м</text><path d="M80 830 L80 800 L140 800 L140 770 L200 770 L200 740 L260 740 L260 710 L320 710 L320 680 L400 680 L400 830Z" fill="#405455" stroke="#84c7c1" stroke-width="2"/><line x1="420" y1="680" x2="420" y2="830" stroke="#d2b583" marker-start="url(#a)" marker-end="url(#a)"/><text x="435" y="760" font-size="14">5 × 0,15 = 0,75 м</text><line x1="80" y1="860" x2="380" y2="860" stroke="#d2b583" marker-start="url(#a)" marker-end="url(#a)"/><text x="118" y="885" font-size="16">5 × 0,30 = 1,50 м</text><text x="60" y="918" fill="#b1b9b5" font-size="14">Показано 5 підйомів; ширина маршу 1,50 м</text><rect x="670" y="540" width="700" height="400" fill="#1d2b2e" stroke="#63706e"/><text x="690" y="575" font-size="20">Бій і прохід · різні масштаби, точні значення</text><circle cx="880" cy="757" r="132" fill="none" stroke="#d2b583" stroke-width="3"/><line x1="748" y1="757" x2="1012" y2="757" stroke="#d2b583" marker-start="url(#a)" marker-end="url(#a)"/><text x="830" y="740" font-size="19">Ø 24 м</text><rect x="1110" y="655" width="176" height="176" fill="url(#grid)" stroke="#84c7c1" stroke-width="3"/><text x="1132" y="733" font-size="20">8 × 8 м</text><text x="1112" y="874" fill="#b1b9b5" font-size="14">Перший бій: 1 тип ворога</text><text x="45" y="976" fill="#b1b9b5" font-size="14">Це розмірний еталон для тесту. Згенеровані концепт-аркуші не є точними кресленнями.</text></g></svg>